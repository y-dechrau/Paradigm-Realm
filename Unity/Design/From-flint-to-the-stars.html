<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From flint to the stars: a strategy-game tech tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --page:#E2CBA6; --pageink:#3B2614;
  --surface:#FFFFFF; --surfink:#1F1B16; --muted:#6B6258; --rule:rgba(0,0,0,.12);
  --line:#B4461A; --unl:#0E7C74; --halo:rgba(255,255,255,.8);
  --kU:#B83227; --kB:#2B6CB0; --kW:#A86B12; --kI:#2F7A4F; --kG:#6B46C1; --kP:#0E7C74; --kA:#4A5568; --kV:#A86B12;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#2A1F14; --pageink:#EBD9BD;
    --surface:#1A1816; --surfink:#EEE7DC; --muted:#A59B8F; --rule:rgba(255,255,255,.14);
    --line:#F2A65A; --unl:#4FD1C5; --halo:rgba(0,0,0,.6);
    --kU:#F08A7E; --kB:#7FB3F0; --kW:#F0C062; --kI:#7DD3A0; --kG:#B79CF5; --kP:#4FD1C5; --kA:#B6BECB; --kV:#F0C062;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#2A1F14; --pageink:#EBD9BD;
  --surface:#1A1816; --surfink:#EEE7DC; --muted:#A59B8F; --rule:rgba(255,255,255,.14);
  --line:#F2A65A; --unl:#4FD1C5; --halo:rgba(0,0,0,.6);
  --kU:#F08A7E; --kB:#7FB3F0; --kW:#F0C062; --kI:#7DD3A0; --kG:#B79CF5; --kP:#4FD1C5; --kA:#B6BECB; --kV:#F0C062;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--page);color:var(--pageink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}

.hero{padding:2.75rem 1.25rem 2rem;max-width:62rem;margin:0 auto}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.5rem,9vw,5rem);line-height:1;margin:0 0 1rem;letter-spacing:-.01em}
.hero p{max-width:38rem;margin:0 0 .75rem;font-size:1.05rem}
.legend{display:flex;flex-wrap:wrap;gap:1.25rem;margin-top:1.25rem;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:.5rem}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);color:var(--surfink);border-bottom:1px solid var(--rule)}
.bar-top{max-width:62rem;margin:0 auto;padding:.6rem 1rem 0;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem}
.mode{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px}
.mode button{font:inherit;font-size:.88rem;font-weight:600;border:0;background:transparent;color:inherit;padding:.3rem .9rem;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--surfink);color:var(--surface)}
.status{display:none;flex-wrap:wrap;align-items:center;gap:.25rem .9rem;font-size:.85rem}
body.play .status{display:flex}
.status b{font-weight:700}
.status .win{color:var(--kV);font-weight:700}
.reset{font:inherit;font-size:.8rem;font-weight:600;background:transparent;color:inherit;border:1px solid var(--rule);border-radius:999px;padding:.15rem .7rem;cursor:pointer}
.eranav{list-style:none;margin:0 auto;padding:.5rem 1rem .6rem;display:flex;gap:.4rem;overflow-x:auto;max-width:62rem;scrollbar-width:none}
.eranav::-webkit-scrollbar{display:none}
.eranav a{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;text-decoration:none;color:inherit;font-size:.82rem;font-weight:500;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--rule)}
.eranav a .dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--sw);border:1px solid rgba(128,128,128,.4)}
.eranav a.on{background:var(--surfink);color:var(--surface);border-color:var(--surfink)}
.bar button:focus-visible,.eranav a:focus-visible{outline:3px solid var(--line);outline-offset:2px}

/* tree */
#tree{position:relative;z-index:0}
#lines{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
#lines path{fill:none}
#lines .h{stroke:var(--halo);stroke-width:5;stroke-linecap:round}
#lines .a{stroke:var(--line);stroke-width:1.6}
#lines .u{stroke:var(--unl);stroke-width:1.9;stroke-dasharray:5 4}

.era{--band:var(--bl);--ink:var(--il);--chip:var(--cl);background:var(--band);color:var(--ink);padding:2.25rem 1.25rem 2.5rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .era{--band:var(--bd);--ink:var(--id);--chip:var(--cd)}}
:root[data-theme="dark"] .era{--band:var(--bd);--ink:var(--id);--chip:var(--cd)}
.era.darkband{--line:#F2A65A;--unl:#4FD1C5}
.era-inner{max-width:62rem;margin:0 auto}
.era-head{margin-bottom:1.25rem;max-width:40rem;display:grid;grid-template-columns:auto 1fr;column-gap:1rem;align-items:baseline}
.era-num{font-family:var(--serif);font-size:clamp(1.7rem,5.5vw,2.6rem);line-height:1.1;opacity:.45;grid-row:span 3}
.era-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,5.5vw,2.6rem);line-height:1.1;margin:0 0 .3rem}
.era-dates{margin:0 0 .4rem;font-weight:600;font-size:.88rem;opacity:.8}
.era-blurb{margin:0;font-size:.98rem}

.nodes{display:flex;flex-wrap:wrap;gap:.55rem}
.node{position:relative;z-index:2;font:inherit;text-align:left;background:var(--chip);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);border-radius:10px;padding:.5rem .75rem .55rem;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;max-width:100%;transition:opacity .2s ease,background-color .2s ease}
.n-name{font-weight:600;font-size:.95rem;line-height:1.2}
.n-meta{font-size:.76rem;opacity:.75;display:flex;gap:.6rem}
.n-check{display:none;font-weight:700}
.node:hover{border-color:color-mix(in srgb,var(--ink) 55%,transparent)}
.node:focus-visible{outline:3px solid var(--line);outline-offset:2px}

#tree.play .node{opacity:.45}
#tree.play .node.avail{opacity:1;box-shadow:0 0 0 2px var(--unl)}
#tree.play .node.done{opacity:1;background:color-mix(in srgb,var(--ink) 16%,var(--chip))}
#tree.play .node.done .n-check{display:inline}
#tree.sel-on .node{opacity:.28}
#tree.sel-on .node.anc,#tree.sel-on .node.unl,#tree.sel-on .node.sel{opacity:1}
.node.anc{border-color:var(--line);border-width:2px}
.node.unl{border-color:var(--unl);border-style:dashed;border-width:2px}
.node.sel{background:var(--ink);color:var(--band);border-color:var(--ink)}

.note{max-width:62rem;margin:0 auto;padding:1.5rem 1.25rem 2.5rem;font-size:.88rem;opacity:.85}
body.sheet-open main{padding-bottom:62vh}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0 auto;max-width:680px;background:var(--surface);color:var(--surfink);border-radius:16px 16px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.25);padding:1rem 1.25rem calc(1.1rem + env(safe-area-inset-bottom,0px));max-height:min(64vh,600px);overflow-y:auto;transform:translateY(110%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.s-era{font-size:.85rem;color:var(--muted);margin:.15rem 0 0}
.s-close{font:inherit;font-size:.9rem;font-weight:600;background:transparent;color:inherit;border:1px solid var(--rule);border-radius:999px;padding:.3rem .85rem;cursor:pointer}
.sheet button:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:1.65rem;line-height:1.15;margin:.35rem 0 .15rem}
.s-cost{margin:0 0 .6rem;font-weight:600;font-size:.92rem}
.s-desc{margin:0 0 .9rem;max-width:36rem}
.s-group{margin-bottom:.95rem}
.s-group h4{margin:0 0 .4rem;font-size:.9rem;font-weight:700}
.unlocks{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
.unlocks li{display:flex;align-items:baseline;gap:.6rem;font-size:.93rem}
.kind{flex:0 0 5.6rem;font-size:.74rem;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:6px;padding:.05rem .4rem;text-align:center}
.s-stats{margin:0 0 1rem;font-size:.88rem;color:var(--muted)}
.s-links{display:flex;flex-wrap:wrap;gap:.4rem}
.s-link{font:inherit;font-size:.85rem;background:transparent;color:inherit;border:1.5px solid var(--line);border-radius:8px;padding:.25rem .6rem;cursor:pointer}
.s-link.u{border-color:var(--unl);border-style:dashed}
.s-none{font-size:.88rem;color:var(--muted);margin:0}
.s-actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 1rem}
.btn{font:inherit;font-size:.92rem;font-weight:700;border-radius:10px;padding:.5rem 1rem;cursor:pointer;border:1.5px solid var(--surfink)}
.btn.primary{background:var(--surfink);color:var(--surface)}
.btn.ghost{background:transparent;color:inherit}
.done-flag{font-weight:700;color:var(--kI)}
.victory{margin:0 0 1rem;padding:.7rem .9rem;border:1.5px solid var(--kV);border-radius:10px;color:var(--kV);font-weight:700}

@media (min-width:700px){
  .hero{padding:4rem 2rem 2.5rem}
  .era{padding:2.75rem 2rem 3rem}
  .note{padding:1.5rem 2rem 3rem}
}
@media (prefers-reduced-motion:reduce){ .sheet,.node{transition:none} }
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>From flint to the stars</h1>
    <p id="intro"></p>
    <p>Explore mode: tap any tech to trace everything it needs and see what it unlocks. Play mode: start with nothing and research your way to a science victory.</p>
    <div class="legend" aria-hidden="true">
      <span><svg width="36" height="10"><path d="M2 5H34" stroke="var(--line)" stroke-width="2"/></svg>Required</span>
      <span><svg width="36" height="10"><path d="M2 5H34" stroke="var(--unl)" stroke-width="2" stroke-dasharray="5 4"/></svg>Leads to</span>
    </div>
  </header>

  <div class="bar">
    <div class="bar-top">
      <div class="mode" role="group" aria-label="Mode">
        <button type="button" id="m-explore" aria-pressed="true">Explore</button>
        <button type="button" id="m-play" aria-pressed="false">Play</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <nav aria-label="Jump to an era"><ol class="eranav" id="nav"></ol></nav>
  </div>

  <div id="tree"><svg id="lines" aria-hidden="true"></svg></div>
</main>

<aside class="sheet" id="sheet" role="dialog" aria-label="Tech details" aria-hidden="true"></aside>

// ---------- model ----------
const byId = {}, kids = {}, eraOf = {}, eraIdx = {};
ERAS.forEach((e,i) => { eraOf[e.k] = e; eraIdx[e.k] = i; });
const posInEra = {};
T.forEach(t => {
  posInEra[t[2]] = (posInEra[t[2]] || 0) + 1;
  const base = eraOf[t[2]].base;
  const cost = Math.round(base * (1 + 0.07 * (posInEra[t[2]] - 1)) / 5) * 5;
  byId[t[0]] = {id:t[0], name:t[1], era:t[2], req:t[3], desc:t[4], un:t[5], cost};
  kids[t[0]] = [];
});
T.forEach(t => t[3].forEach(p => kids[p].push(t[0])));
ERAS.forEach(e => {
  const cs = T.filter(t => t[2] === e.k).map(t => byId[t[0]].cost);
  e.range = `${Math.min(...cs).toLocaleString("en-GB")}–${Math.max(...cs).toLocaleString("en-GB")} science per tech`;
});
function ancestors(id){ const s = new Set(); (function go(n){ byId[n].req.forEach(p => { if(!s.has(p)){ s.add(p); go(p); } }); })(id); return s; }
function descendants(id){ const s = new Set(); (function go(n){ kids[n].forEach(c => { if(!s.has(c)){ s.add(c); go(c); } }); })(id); return s; }
const fmt = n => n.toLocaleString("en-GB");

// ---------- state ----------
const KEY = "techtree-play-v1";
let play = false, done = new Set();
try {
  const s = JSON.parse(localStorage.getItem(KEY) || "null");
  if (s){ play = !!s.play; done = new Set((s.done || []).filter(id => byId[id])); }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({play, done:[...done]})); } catch(e){} }
const avail = id => !done.has(id) && byId[id].req.every(p => done.has(p));

// ---------- render ----------
const tree = document.getElementById("tree"), svg = document.getElementById("lines");
const nav = document.getElementById("nav"), sheet = document.getElementById("sheet"), status = document.getElementById("status");
const els = {};
const totalCost = T.reduce((s,t) => s + byId[t[0]].cost, 0);
document.getElementById("intro").textContent =
  `${T.length} techs across ${ERAS.length} ages, from the first flint tool to a science victory. Each tech has a research cost, the techs it requires, and the units, buildings, wonders and bonuses it unlocks.`;

ERAS.forEach((e, i) => {
  const c = e.c;
  const sec = document.createElement("section");
  sec.className = "era" + (e.dark ? " darkband" : "");
  sec.id = "era-" + e.k;
  sec.setAttribute("style", `--bl:${c[0]};--il:${c[1]};--cl:${c[2]};--bd:${c[3]};--id:${c[4]};--cd:${c[5]}`);
  sec.innerHTML = `<div class="era-inner"><div class="era-head"><span class="era-num">${i+1}</span><h2>${e.n}</h2><p class="era-dates">${e.range}</p><p class="era-blurb">${e.b}</p></div><div class="nodes"></div></div>`;
  const box = sec.querySelector(".nodes");
  T.filter(t => t[2] === e.k).forEach(t => {
    const d = byId[t[0]];
    const wonder = d.un.some(u => u[0] === "W");
    const b = document.createElement("button");
    b.className = "node"; b.type = "button"; b.dataset.id = d.id;
    b.setAttribute("aria-pressed","false");
    b.innerHTML = `<span class="n-name"><span class="n-check">✓ </span>${d.name}</span><span class="n-meta"><span>⚗ ${fmt(d.cost)}</span>${wonder ? "<span>★ Wonder</span>" : ""}</span>`;
    b.addEventListener("click", () => select(cur === d.id ? null : d.id, false));
    box.appendChild(b); els[d.id] = b;
  });
  tree.appendChild(sec);

  const li = document.createElement("li");
  li.innerHTML = `<a href="#era-${e.k}" data-era="${e.k}" style="--sw:${c[0]}"><span class="dot"></span>${e.n.replace(" Age","")}</a>`;
  li.querySelector("a").addEventListener("click", ev => {
    ev.preventDefault();
    document.getElementById("era-" + e.k).scrollIntoView({behavior: reduce() ? "auto" : "smooth", block:"start"});
  });
  nav.appendChild(li);
});
const note = document.createElement("p");
note.className = "note";
note.textContent = `Costs rise each age, so the full tree takes ${fmt(totalCost)} science. Late ages are speculative by design: fusion, terraforming and starships are game fiction built on plausible science.`;
tree.after(note);

function reduce(){ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

// ---------- modes ----------
const mExplore = document.getElementById("m-explore"), mPlay = document.getElementById("m-play");
function setMode(p){
  play = p; save();
  mExplore.setAttribute("aria-pressed", String(!p)); mPlay.setAttribute("aria-pressed", String(p));
  document.body.classList.toggle("play", p); tree.classList.toggle("play", p);
  refreshPlay(); if (cur) openSheet(cur);
}
mExplore.addEventListener("click", () => setMode(false));
mPlay.addEventListener("click", () => setMode(true));

function refreshPlay(){
  Object.values(els).forEach(b => {
    const id = b.dataset.id;
    b.classList.toggle("done", play && done.has(id));
    b.classList.toggle("avail", play && avail(id));
  });
  const spent = [...done].reduce((s,id) => s + byId[id].cost, 0);
  let era = "None yet";
  if (done.size){ const top = Math.max(...[...done].map(id => eraIdx[byId[id].era])); era = ERAS[top].n; }
  const win = done.has("transcendence");
  status.innerHTML = `<span>Researched <b>${done.size}</b> of ${T.length}</span><span>Science spent <b>${fmt(spent)}</b></span><span>${win ? '<span class="win">Science victory</span>' : `Age <b>${era}</b>`}</span><button type="button" class="reset">Reset</button>`;
  status.querySelector(".reset").addEventListener("click", () => {
    if (!done.size || confirm("Reset all research?")){ done.clear(); save(); refreshPlay(); if (cur) openSheet(cur); }
  });
}
function research(ids){ ids.forEach(i => done.add(i)); save(); refreshPlay(); openSheet(cur); }

// ---------- selection ----------
let cur = null, anc = new Set();
function select(id, fromSheet){
  cur = id;
  Object.values(els).forEach(b => { b.classList.remove("anc","unl","sel"); b.setAttribute("aria-pressed","false"); });
  if (!id){ tree.classList.remove("sel-on"); closeSheet(); draw(); return; }
  anc = ancestors(id);
  tree.classList.add("sel-on");
  anc.forEach(a => els[a].classList.add("anc"));
  kids[id].forEach(u => els[u].classList.add("unl"));
  els[id].classList.add("sel"); els[id].setAttribute("aria-pressed","true");
  openSheet(id);
  requestAnimationFrame(() => {
    draw();
    const r = els[id].getBoundingClientRect();
    const limit = window.innerHeight - sheet.offsetHeight - 16;
    if (fromSheet || r.bottom > limit || r.top < 120){
      const y = window.scrollY + r.top - Math.max(130, (limit - r.height) / 2);
      window.scrollTo({top: y, behavior: reduce() ? "auto" : "smooth"});
    }
  });
}
function linkList(ids, cls){
  if (!ids.length) return null;
  return ids.map(i => `<button type="button" class="s-link ${cls}" data-go="${i}">${play && done.has(i) ? "✓ " : ""}${byId[i].name}</button>`).join("");
}
function openSheet(id){
  const t = byId[id], e = eraOf[t.era];
  const path = [...anc, id];
  const pathCost = path.reduce((s,i) => s + byId[i].cost, 0);
  const desc = descendants(id).size;
  const unlocks = t.un.map(u => { const k = u[0], name = u.slice(2); return `<li><span class="kind" style="--k:var(--k${k})">${KINDS[k]}</span><span>${name}</span></li>`; }).join("");
  let actions = "";
  if (play){
    if (done.has(id)) actions = `<div class="s-actions"><span class="done-flag">✓ Researched</span></div>`;
    else if (avail(id)) actions = `<div class="s-actions"><button type="button" class="btn primary" data-act="one">Research for ${fmt(t.cost)} science</button></div>`;
    else {
      const todo = path.filter(i => !done.has(i));
      const c = todo.reduce((s,i) => s + byId[i].cost, 0);
      actions = `<div class="s-actions"><button type="button" class="btn ghost" data-act="path">Research path: ${todo.length} techs, ${fmt(c)} science</button></div>`;
    }
  }
  const victory = play && id === "transcendence" && done.has(id) ? `<p class="victory">Science victory. Your civilisation has transcended.</p>` : "";
  const needs = linkList(t.req, "a"), leads = linkList(kids[id], "u");
  sheet.innerHTML = `
    <div class="s-top"><p class="s-era">${e.n}</p><button type="button" class="s-close">Close</button></div>
    <h3>${t.name}</h3>
    <p class="s-cost">⚗ ${fmt(t.cost)} science</p>
    ${victory}${actions}
    <p class="s-desc">${t.desc}</p>
    <div class="s-group"><h4>Unlocks</h4><ul class="unlocks">${unlocks}</ul></div>
    <p class="s-stats">${t.req.length ? `Reaching it from scratch takes ${path.length} techs and ${fmt(pathCost)} science.` : "Your starting tech."} ${desc ? `${desc} later techs depend on it.` : "Nothing later depends on it."}</p>
    <div class="s-group"><h4>Requires</h4>${needs ? `<div class="s-links">${needs}</div>` : `<p class="s-none">Nothing. Every game starts here.</p>`}</div>
    <div class="s-group"><h4>Leads to</h4>${leads ? `<div class="s-links">${leads}</div>` : `<p class="s-none">The end of the tree.</p>`}</div>`;
  sheet.querySelector(".s-close").addEventListener("click", () => { const last = cur; select(null); if (last) els[last].focus(); });
  sheet.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go, true)));
  const one = sheet.querySelector('[data-act="one"]'); if (one) one.addEventListener("click", () => research([id]));
  const pth = sheet.querySelector('[data-act="path"]'); if (pth) pth.addEventListener("click", () => research(path));
  sheet.classList.add("open"); sheet.setAttribute("aria-hidden","false");
  document.body.classList.add("sheet-open");
}
function closeSheet(){ sheet.classList.remove("open"); sheet.setAttribute("aria-hidden","true"); document.body.classList.remove("sheet-open"); }
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && cur){ const last = cur; select(null); els[last].focus(); } });

// ---------- lines ----------
function box(id, tr){
  const r = els[id].getBoundingClientRect();
  return {l:r.left-tr.left, r:r.right-tr.left, t:r.top-tr.top, b:r.bottom-tr.top, cx:(r.left+r.right)/2-tr.left, cy:(r.top+r.bottom)/2-tr.top};
}
function pathFor(a, b){
  if (a.b <= b.t + 2){ const dy = Math.max(18, (b.t - a.b) * 0.5); return `M${a.cx},${a.b} C${a.cx},${a.b+dy} ${b.cx},${b.t-dy} ${b.cx},${b.t}`; }
  if (b.b <= a.t + 2){ const dy = Math.max(18, (a.t - b.b) * 0.5); return `M${a.cx},${a.t} C${a.cx},${a.t-dy} ${b.cx},${b.b+dy} ${b.cx},${b.b}`; }
  const right = a.cx < b.cx, x1 = right ? a.r : a.l, x2 = right ? b.l : b.r;
  const dx = Math.max(14, Math.abs(x2 - x1) / 2) * (right ? 1 : -1);
  return `M${x1},${a.cy} C${x1+dx},${a.cy} ${x2-dx},${b.cy} ${x2},${b.cy}`;
}
function draw(){
  const w = tree.offsetWidth, h = tree.offsetHeight;
  svg.setAttribute("width", w); svg.setAttribute("height", h); svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  if (!cur){ svg.innerHTML = ""; return; }
  const tr = tree.getBoundingClientRect(), boxes = {};
  const B = id => boxes[id] || (boxes[id] = box(id, tr));
  const edges = [];
  [...anc, cur].forEach(n => byId[n].req.forEach(p => { if (anc.has(p)) edges.push([p, n, "a"]); }));
  kids[cur].forEach(u => edges.push([cur, u, "u"]));
  let halo = "", main = "";
  edges.forEach(([p, n, c]) => { const d = pathFor(B(p), B(n)); halo += `<path class="h" d="${d}"/>`; main += `<path class="${c}" d="${d}"/>`; });
  svg.innerHTML = halo + main;
}
let raf = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

// ---------- active era ----------
if ("IntersectionObserver" in window){
  const links = {}; nav.querySelectorAll("a").forEach(a => links[a.dataset.era] = a);
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){
        Object.values(links).forEach(a => a.classList.remove("on"));
        const a = links[en.target.id.slice(4)]; a.classList.add("on");
        nav.scrollTo({left: a.parentElement.offsetLeft - 16});
      }
    });
  }, {rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll(".era").forEach(s => io.observe(s));
}
setMode(play);
draw();
</script>
